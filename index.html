<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meow Sheets - Ultimate Enterprise Edition</title>

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">

  <!-- Librerías Externas (SheetJS, Chart.js, QRCode.js, Html5Qrcode) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --bg: #050505;
      --app-bg: #000000;
      --text: #ffffff;
      --border: #ffffff;
      --subtext: #888888;
      --grid-line: #222222;
      --cell-bg: #000000;
      --cell-active: #111111;
      --accent: #00ff66;
      --border-thick: 2px;
      --border-thin: 1px;
    }

    body.light-mode {
      --bg: #f0f0f0;
      --app-bg: #ffffff;
      --text: #000000;
      --border: #000000;
      --subtext: #666666;
      --grid-line: #e0e0e0;
      --cell-bg: #ffffff;
      --cell-active: #f5f5f5;
      --accent: #008037;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100vh; height: 100dvh; overflow: hidden; background-color: var(--bg); color: var(--text); font-family: 'Source Code Pro', monospace; }
    body { padding: 8px; display: flex; justify-content: center; align-items: center; }

    .app-frame {
      width: 100%; max-width: 1200px; height: 100%; max-height: calc(100dvh - 16px);
      display: flex; flex-direction: column; background-color: var(--app-bg);
      border: 3px solid var(--border); overflow: hidden; position: relative;
    }

    header {
      display: grid; grid-template-columns: 80px 1fr 44px 80px;
      border-bottom: var(--border-thick) solid var(--border); align-items: stretch; flex-shrink: 0;
    }

    .header-btn {
      background: transparent; color: var(--text); border: none;
      border-right: var(--border-thick) solid var(--border); padding: 8px 4px;
      font-size: 11px; letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
      display: flex; align-items: center; justify-content: center;
    }

    .header-btn:hover { background: var(--text); color: var(--app-bg); }

    .brand-title {
      font-family: 'Oswald', sans-serif; font-size: 18px; letter-spacing: 2px;
      text-transform: uppercase; text-align: center; padding: 8px 0; font-weight: 700;
    }

    /* PESTAÑAS DE NAVEGACIÓN SUBMENÚ */
    .menu-selector-bar {
      display: flex; background: var(--app-bg); border-bottom: var(--border-thin) solid var(--border);
      overflow-x: auto; flex-shrink: 0;
    }

    .menu-tab-btn {
      background: transparent; color: var(--subtext); border: none;
      border-right: var(--border-thin) solid var(--border); padding: 6px 12px;
      font-size: 10px; cursor: pointer; text-transform: uppercase; font-family: 'Oswald', sans-serif;
      letter-spacing: 1px;
    }

    .menu-tab-btn.active {
      color: var(--text); background: var(--cell-active);
      border-bottom: 2px solid var(--accent); font-weight: bold;
    }

    /* BARRA DE HERRAMIENTAS Y OPCIONES */
    .toolbar-container {
      border-bottom: var(--border-thick) solid var(--border);
      background: var(--app-bg); min-height: 36px; display: flex; align-items: center;
    }

    .sub-toolbar {
      display: none; flex-wrap: wrap; gap: 4px; padding: 4px; align-items: center; width: 100%;
    }

    .sub-toolbar.active { display: flex; }

    .tool-select, .tool-input-color, .tool-input {
      background: var(--app-bg); color: var(--text); border: var(--border-thin) solid var(--border);
      padding: 4px; font-size: 10px; outline: none; font-family: inherit;
    }

    .formula-bar {
      display: flex; align-items: center; border-bottom: var(--border-thick) solid var(--border);
      background: var(--app-bg);
    }

    .cell-address {
      width: 60px; padding: 8px; font-weight: bold; text-align: center;
      border-right: var(--border-thin) solid var(--border); color: var(--accent); font-size: 12px;
    }

    .formula-input {
      flex: 1; background: transparent; border: none; color: var(--text);
      padding: 8px 12px; font-family: 'Source Code Pro', monospace; font-size: 12px; outline: none;
    }

    /* MATRIZ Y REDIMENSIONAMIENTO */
    .sheet-container { flex: 1; overflow: auto; position: relative; }

    table.grid-table { border-collapse: collapse; table-layout: fixed; }

    th, td {
      border: var(--border-thin) solid var(--grid-line); min-width: 80px; height: 28px;
      font-size: 11px; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      position: relative;
    }

    th {
      background: var(--app-bg); color: var(--subtext); font-weight: bold; text-align: center;
      position: sticky; top: 0; z-index: 2; border-bottom: var(--border-thick) solid var(--border); user-select: none;
      resize: horizontal; overflow: auto;
    }

    th.row-header {
      width: 45px; min-width: 45px; position: sticky; left: 0; z-index: 3;
      border-right: var(--border-thick) solid var(--border);
      resize: vertical; overflow: auto;
    }

    /* Controladores visuales de resize */
    .col-resizer {
      position: absolute; right: 0; top: 0; width: 5px; height: 100%;
      cursor: col-resize; user-select: none; z-index: 4;
    }

    .row-resizer {
      position: absolute; left: 0; bottom: 0; width: 100%; height: 5px;
      cursor: row-resize; user-select: none; z-index: 4;
    }

    td { background: var(--cell-bg); color: var(--text); outline: none; }
    td.selected { border: 2px solid var(--accent) !important; background: var(--cell-active); }
    td.highlight-search { background: #554400 !important; color: #fff; }
    td.wrap-text { white-space: normal; word-break: break-word; }

    /* CONTROLES INFERIORES Y PESTAÑAS */
    .sheet-tabs { display: flex; border-top: var(--border-thick) solid var(--border); background: var(--app-bg); overflow-x: auto; }
    .tab-btn { background: transparent; color: var(--subtext); border: none; border-right: var(--border-thin) solid var(--border); padding: 8px 16px; font-size: 10px; cursor: pointer; text-transform: uppercase; }
    .tab-btn.active { color: var(--text); font-weight: bold; border-top: 2px solid var(--accent); background: var(--cell-active); }

    .bottom-controls { display: flex; border-top: var(--border-thick) solid var(--border); background: var(--app-bg); }
    .export-btn { margin-left: auto; background: var(--accent); color: #000; font-weight: bold; border: none; padding: 10px 16px; font-family: 'Oswald', sans-serif; cursor: pointer; }

    /* MODALES NATIVAS */
    .modal {
      display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90%; max-width: 500px; background: var(--app-bg); border: var(--border-thick) solid var(--border);
      padding: 16px; z-index: 100; box-shadow: 0 0 20px rgba(0,0,0,0.9);
    }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: bold; font-size: 12px; }
    .modal-close { background: none; color: var(--text); border: none; cursor: pointer; font-size: 14px; }

    /* ESTILOS PARA IMPRESIÓN / PDF */
    @media print {
      body { padding: 0; background: #fff; color: #000; }
      .app-frame { border: none; max-width: 100%; height: auto; }
      header, .menu-selector-bar, .toolbar-container, .formula-bar, .sheet-tabs, .bottom-controls, .modal { display: none !important; }
      .sheet-container { overflow: visible; }
      table.grid-table { border: 1px solid #000; }
      th, td { border: 1px solid #000; color: #000 !important; background: #fff !important; }
    }
  </style>
</head>
<body>

  <div class="app-frame">
    <header>
      <button class="header-btn" onclick="modifyStructure('addRow')">+FILA</button>
      <div class="brand-title">MEOW SHEETS PRO</div>
      <button class="header-btn" onclick="toggleTheme()">🌙</button>
      <button class="header-btn" style="border-right: none;" onclick="modifyStructure('addCol')">+COL</button>
    </header>

    <!-- NAVEGACIÓN DE SUBMENÚS -->
    <div class="menu-selector-bar">
      <button class="menu-tab-btn active" onclick="switchSubmenu('archivo')">📁 Archivo</button>
      <button class="menu-tab-btn" onclick="switchSubmenu('edicion')">✏️ Edición</button>
      <button class="menu-tab-btn" onclick="switchSubmenu('formato')">🎨 Formato</button>
      <button class="menu-tab-btn" onclick="switchSubmenu('datos')">📊 Datos & Fórmulas</button>
      <button class="menu-tab-btn" onclick="switchSubmenu('herramientas')">📸 Herramientas</button>
    </div>

    <!-- CONTENEDOR DE TOOLBARS ORGANIZADAS POR SUBMENÚ -->
    <div class="toolbar-container">
      
      <!-- Submenú: ARCHIVO -->
      <div id="sub-archivo" class="sub-toolbar active">
        <button class="header-btn" style="padding: 4px 8px;" onclick="saveToStorage()">💾 Guardar</button>
        <button class="header-btn" style="padding: 4px 8px;" onclick="exportToExcel()">📄 Exportar XLSX</button>
        <button class="header-btn" style="padding: 4px 8px;" onclick="exportPDF()">🖨️ PDF / Imprimir</button>
        <button class="header-btn" style="padding: 4px 8px; border-right:none;" onclick="clearSheet()">Vaciar Hoja</button>
      </div>

      <!-- Submenú: EDICIÓN -->
      <div id="sub-edicion" class="sub-toolbar">
        <button class="header-btn" style="padding: 4px 8px;" onclick="undo()" title="Deshacer (Ctrl+Z)">↩ Deshacer</button>
        <button class="header-btn" style="padding: 4px 8px;" onclick="redo()" title="Rehacer (Ctrl+Y)">↪ Rehacer</button>
        <button class="header-btn" style="padding: 4px 8px;" onclick="openModal('searchModal')">🔍 Buscar / Reemplazar</button>
        <button class="header-btn" style="padding: 4px 8px; border-right:none;" onclick="clearSelectedCell()">🗑️ Limpiar Celda</button>
      </div>

      <!-- Submenú: FORMATO -->
      <div id="sub-formato" class="sub-toolbar">
        <button class="header-btn" style="padding: 4px 8px;" onclick="applyFormat('bold')"><b>B</b></button>
        <button class="header-btn" style="padding: 4px 8px;" onclick="applyFormat('wrap')">Wrap</button>
        <select class="tool-select" id="formatType" onchange="setCellFormat(this.value)">
          <option value="text">Texto Libre</option>
          <option value="currency">Moneda ($)</option>
          <option value="percent">Porcentaje (%)</option>
          <option value="dropdown">Lista Desplegable</option>
        </select>
        <label style="font-size:10px;">Texto: <input type="color" class="tool-input-color" id="textColor" onchange="applyStyle('color', this.value)"></label>
        <label style="font-size:10px;">Fondo: <input type="color" class="tool-input-color" id="bgColor" onchange="applyStyle('backgroundColor', this.value)"></label>
        <button class="header-btn" style="padding: 4px 8px; border-right:none;" onclick="openModal('conditionalModal')">🎨 Formato Condicional</button>
      </div>

      <!-- Submenú: DATOS Y FÓRMULAS -->
      <div id="sub-datos" class="sub-toolbar">
        <button class="header-btn" style="padding: 4px 8px;" onclick="sortColumn('ASC')">A-Z</button>
        <button class="header-btn" style="padding: 4px 8px;" onclick="sortColumn('DESC')">Z-A</button>
        <button class="header-btn" style="padding: 4px 8px;" onclick="insertFormulaTemplate('SUMA')">∑ SUMA</button>
        <button class="header-btn" style="padding: 4px 8px;" onclick="insertFormulaTemplate('PROMEDIO')">x̄ PROMEDIO</button>
        <button class="header-btn" style="padding: 4px 8px;" onclick="generateChart()">📊 Gráfico</button>
        <button class="header-btn" style="padding: 4px 8px; border-right:none;" onclick="openModal('dropdownModal')">📋 Crear Desplegable</button>
      </div>

      <!-- Submenú: HERRAMIENTAS -->
      <div id="sub-herramientas" class="sub-toolbar">
        <button class="header-btn" style="padding: 4px 8px;" onclick="generateQR()">📱 Generar QR</button>
        <button class="header-btn" style="padding: 4px 8px; border-right:none;" onclick="startScanner()">📷 Escanear Cámara</button>
      </div>

    </div>

    <!-- BARRA DE FÓRMULAS -->
    <div class="formula-bar">
      <div class="cell-address" id="selectedCellAddr">A1</div>
      <input type="text" class="formula-input" id="formulaInput" placeholder="Fórmulas: =SUMA(A1:A5), =PROMEDIO(A1:A5), =MAX(), =MIN(), =SI(A1>10; 'ALTO'; 'BAJO')" oninput="onFormulaInput(this.value)">
    </div>

    <!-- TABLA DE CELDAS -->
    <div class="sheet-container">
      <table class="grid-table" id="gridTable">
        <thead><tr id="headerRow"><th class="row-header">#</th></tr></thead>
        <tbody id="gridBody"></tbody>
      </table>
    </div>

    <!-- PESTAÑAS Y CONTROLES -->
    <div class="sheet-tabs" id="tabsBar">
      <button class="tab-btn active" onclick="switchSheet(0)">HOJA 1</button>
      <button class="tab-btn" style="color:var(--accent);" onclick="addNewSheet()">+ Nueva Hoja</button>
    </div>

    <div class="bottom-controls">
      <button class="header-btn" style="padding: 10px 14px;" onclick="saveToStorage()">💾 Guardar</button>
      <button class="header-btn" style="padding: 10px 14px;" onclick="clearSheet()">Vaciar</button>
      <button class="export-btn" onclick="exportToExcel()">EXPORTAR .XLSX</button>
    </div>
  </div>

  <!-- MODAL BÚSQUEDA Y REEMPLAZO -->
  <div id="searchModal" class="modal">
    <div class="modal-header">
      <span>BUSCAR Y REEMPLAZAR</span>
      <button class="modal-close" onclick="closeModal('searchModal')">✕</button>
    </div>
    <input type="text" class="tool-input" id="searchInput" placeholder="Buscar..." style="width:100%; margin-bottom:8px;">
    <input type="text" class="tool-input" id="replaceInput" placeholder="Reemplazar con..." style="width:100%; margin-bottom:12px;">
    <div style="display:flex; gap:8px;">
      <button class="header-btn" style="flex:1;" onclick="executeSearch()">Buscar</button>
      <button class="header-btn" style="flex:1;" onclick="executeReplace()">Reemplazar Todo</button>
    </div>
  </div>

  <!-- MODAL LISTA DESPLEGABLE -->
  <div id="dropdownModal" class="modal">
    <div class="modal-header">
      <span>DEFINIR OPCIONES DESPLEGABLES</span>
      <button class="modal-close" onclick="closeModal('dropdownModal')">✕</button>
    </div>
    <input type="text" class="tool-input" id="dropdownOptionsInput" placeholder="Separadas por coma: Opción A, Opción B, Completado" style="width:100%; margin-bottom:12px;">
    <button class="header-btn" style="width:100%;" onclick="applyCustomDropdown()">Aplicar a Celda Activa</button>
  </div>

  <!-- MODAL FORMATO CONDICIONAL -->
  <div id="conditionalModal" class="modal">
    <div class="modal-header">
      <span>FORMATO CONDICIONAL</span>
      <button class="modal-close" onclick="closeModal('conditionalModal')">✕</button>
    </div>
    <select class="tool-select" id="condRule" style="width:100%; margin-bottom:8px;">
      <option value="gt">Es Mayor Que</option>
      <option value="lt">Es Menor Que</option>
      <option value="eq">Es Igual A</option>
    </select>
    <input type="text" class="tool-input" id="condVal" placeholder="Valor de prueba..." style="width:100%; margin-bottom:8px;">
    <label style="font-size:10px; display:block; margin-bottom:12px;">Color Resaltado: <input type="color" class="tool-input-color" id="condColor" value="#554400"></label>
    <button class="header-btn" style="width:100%;" onclick="applyConditionalRule()">Aplicar a Hoja</button>
  </div>

  <!-- MODAL CÓDIGO QR -->
  <div id="qrModal" class="modal">
    <div class="modal-header">
      <span>CÓDIGO QR GENERADO</span>
      <button class="modal-close" onclick="closeModal('qrModal')">✕</button>
    </div>
    <div id="qrcode" style="display:flex; justify-content:center; padding:10px; background:#fff;"></div>
  </div>

  <!-- MODAL ESCÁNER DE BARRAS / QR -->
  <div id="scannerModal" class="modal">
    <div class="modal-header">
      <span>ESCANEAR CÓDIGO CON CÁMARA</span>
      <button class="modal-close" onclick="stopScanner()">✕</button>
    </div>
    <div id="reader" style="width:100%;"></div>
  </div>

  <!-- MODAL DE GRÁFICO (CHART.JS) -->
  <div id="chartModal" class="modal">
    <div class="modal-header">
      <span>VISTA PREVIA DE GRÁFICO</span>
      <button class="modal-close" onclick="closeModal('chartModal')">✕</button>
    </div>
    <canvas id="myChart"></canvas>
  </div>

  <script>
    let numRows = 20;
    let numCols = 10;
    let currentSheetIndex = 0;
    let sheetsData = [{}]; 
    let cellFormats = [{}]; 
    let cellStyles = [{}];  
    let activeCell = { row: 1, col: 1 };
    let historyStack = [];
    let historyStep = -1;
    let chartInstance = null;
    let html5QrcodeScanner = null;

    function getColName(colIdx) {
      let temp, letter = '';
      while (colIdx > 0) {
        temp = (colIdx - 1) % 26;
        letter = String.fromCharCode(65 + temp) + letter;
        colIdx = (colIdx - temp - 1) / 26;
      }
      return letter;
    }

    function initGrid() {
      const headerRow = document.getElementById('headerRow');
      headerRow.innerHTML = '<th class="row-header">#</th>';
      for (let c = 1; c <= numCols; c++) {
        const th = document.createElement('th');
        th.innerText = getColName(c);
        th.dataset.col = c;
        addResizerToColumn(th, c);
        headerRow.appendChild(th);
      }

      const gridBody = document.getElementById('gridBody');
      gridBody.innerHTML = '';
      for (let r = 1; r <= numRows; r++) {
        const tr = document.createElement('tr');
        const th = document.createElement('th');
        th.className = 'row-header';
        th.innerText = r;
        th.dataset.row = r;
        addResizerToRow(th, r);
        tr.appendChild(th);

        for (let c = 1; c <= numCols; c++) {
          const td = document.createElement('td');
          td.dataset.row = r;
          td.dataset.col = c;
          td.contentEditable = true;
          td.addEventListener('focus', () => selectCell(r, c));
          td.addEventListener('input', (e) => onCellEdit(r, c, e.target.innerText));
          td.addEventListener('keydown', (e) => handleKeyEvents(e, r, c));
          tr.appendChild(td);
        }
        gridBody.appendChild(tr);
      }
      loadFromStorage();
      renderSheet();
      saveStateToHistory();
    }

    /* SISTEMA DE SUBMENÚS */
    function switchSubmenu(name) {
      document.querySelectorAll('.menu-tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.sub-toolbar').forEach(tb => tb.classList.remove('active'));

      event.target.classList.add('active');
      const targetSub = document.getElementById(`sub-${name}`);
      if (targetSub) targetSub.classList.add('active');
    }

    /* REDIMENSIONAMIENTO DE FILAS Y COLUMNAS */
    function addResizerToColumn(th, colIdx) {
      const resizer = document.createElement('div');
      resizer.className = 'col-resizer';
      th.appendChild(resizer);

      resizer.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const startX = e.clientX;
        const startWidth = th.offsetWidth;
        const onMouseMove = (moveEvent) => {
          const newWidth = Math.max(40, startWidth + (moveEvent.clientX - startX));
          document.querySelectorAll(`td[data-col="${colIdx}"], th[data-col="${colIdx}"]`).forEach(cell => {
            cell.style.width = newWidth + 'px';
            cell.style.minWidth = newWidth + 'px';
          });
        };
        const onMouseUp = () => {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
        };
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });
    }

    function addResizerToRow(th, rowIdx) {
      const resizer = document.createElement('div');
      resizer.className = 'row-resizer';
      th.appendChild(resizer);

      resizer.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const startY = e.clientY;
        const startHeight = th.offsetHeight;
        const onMouseMove = (moveEvent) => {
          const newHeight = Math.max(20, startHeight + (moveEvent.clientY - startY));
          document.querySelectorAll(`td[data-row="${rowIdx}"], th[data-row="${rowIdx}"]`).forEach(cell => {
            cell.style.height = newHeight + 'px';
          });
        };
        const onMouseUp = () => {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
        };
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });
    }

    function selectCell(r, c) {
      document.querySelectorAll('td.selected').forEach(el => el.classList.remove('selected'));
      activeCell = { row: r, col: c };
      const cellKey = `${getColName(c)}${r}`;
      document.getElementById('selectedCellAddr').innerText = cellKey;

      const td = getTdElement(r, c);
      if (td) {
        td.classList.add('selected');
        const rawVal = sheetsData[currentSheetIndex][cellKey] || '';
        document.getElementById('formulaInput').value = rawVal;
        document.getElementById('formatType').value = (cellFormats[currentSheetIndex] && cellFormats[currentSheetIndex][cellKey]) || 'text';
      }
    }

    function getTdElement(r, c) {
      return document.querySelector(`td[data-row="${r}"][data-col="${c}"]`);
    }

    function onCellEdit(r, c, val) {
      const cellKey = `${getColName(c)}${r}`;
      sheetsData[currentSheetIndex][cellKey] = val;
      evaluateAllFormulas();
      saveToStorage();
      saveStateToHistory();
    }

    function onFormulaInput(val) {
      const { row, col } = activeCell;
      const cellKey = `${getColName(col)}${row}`;
      sheetsData[currentSheetIndex][cellKey] = val;
      evaluateAllFormulas();
      saveToStorage();
      saveStateToHistory();
    }

    function insertFormulaTemplate(type) {
      const colName = getColName(activeCell.col);
      const formulaStr = `=${type}(${colName}1:${colName}${Math.max(1, activeCell.row - 1)})`;
      document.getElementById('formulaInput').value = formulaStr;
      onFormulaInput(formulaStr);
    }

    function evaluateAllFormulas() {
      const currentData = sheetsData[currentSheetIndex];
      const currentFmt = cellFormats[currentSheetIndex] || {};

      for (let r = 1; r <= numRows; r++) {
        for (let c = 1; c <= numCols; c++) {
          const cellKey = `${getColName(c)}${r}`;
          const td = getTdElement(r, c);
          if (!td) continue;

          let rawVal = currentData[cellKey] || '';
          let displayVal = rawVal;

          if (rawVal.startsWith('=')) {
            displayVal = parseFormula(rawVal.substring(1), currentData);
          }

          // Formatos de datos
          const fmt = currentFmt[cellKey];
          if (fmt === 'currency' && !isNaN(parseFloat(displayVal))) {
            displayVal = '$' + parseFloat(displayVal).toFixed(2);
          } else if (fmt === 'percent' && !isNaN(parseFloat(displayVal))) {
            displayVal = (parseFloat(displayVal) * 100).toFixed(1) + '%';
          } else if (fmt === 'dropdown' && !td.querySelector('select')) {
            createDropdownCell(td, cellKey, rawVal);
            continue;
          }

          if (document.activeElement !== td && fmt !== 'dropdown') {
            td.innerText = displayVal;
          }
        }
      }
    }

    function createDropdownCell(td, cellKey, rawVal, customOpts) {
      td.innerText = '';
      const select = document.createElement('select');
      select.className = 'tool-select';
      select.style.width = '100%';
      select.style.border = 'none';
      const options = customOpts || ['Opción A', 'Opción B', 'Opción C', 'Completado', 'Pendiente'];
      options.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt; o.innerText = opt;
        if (opt === rawVal) o.selected = true;
        select.appendChild(o);
      });
      select.onchange = (e) => onCellEdit(td.dataset.row, td.dataset.col, e.target.value);
      td.appendChild(select);
    }

    function applyCustomDropdown() {
      const val = document.getElementById('dropdownOptionsInput').value;
      if (!val) return;
      const opts = val.split(',').map(s => s.trim());
      const cellKey = `${getColName(activeCell.col)}${activeCell.row}`;
      setCellFormat('dropdown');
      const td = getTdElement(activeCell.row, activeCell.col);
      if (td) createDropdownCell(td, cellKey, '', opts);
      closeModal('dropdownModal');
    }

    function parseFormula(formula, data) {
      try {
        let clean = formula.toUpperCase().trim();

        if (clean.includes('(') && clean.endsWith(')')) {
          const fnName = clean.substring(0, clean.indexOf('('));
          const rangeStr = clean.substring(clean.indexOf('(') + 1, clean.length - 1);
          const values = getValuesFromRange(rangeStr, data);

          if (fnName === 'SUMA') return values.reduce((a, b) => a + b, 0);
          if (fnName === 'PROMEDIO') return values.length ? (values.reduce((a, b) => a + b, 0) / values.length) : 0;
          if (fnName === 'MAX') return values.length ? Math.max(...values) : 0;
          if (fnName === 'MIN') return values.length ? Math.min(...values) : 0;
          if (fnName === 'CONTAR') return values.length;
        }

        if (clean.startsWith('SI(') && clean.endsWith(')')) {
          const args = clean.substring(3, clean.length - 1).split(';');
          const condition = args[0].replace(/[A-Z]+[0-9]+/g, m => parseFloat(data[m]) || 0);
          const resTrue = args[1] ? args[1].trim().replace(/'/g, '') : 'VERDADERO';
          const resFalse = args[2] ? args[2].trim().replace(/'/g, '') : 'FALSO';
          return Function(`'use strict'; return (${condition})`)() ? resTrue : resFalse;
        }

        clean = clean.replace(/[A-Z]+[0-9]+/g, (match) => {
          const val = parseFloat(data[match]);
          return isNaN(val) ? 0 : val;
        });

        return Function(`'use strict'; return (${clean})`)();
      } catch (err) {
        return '#ERROR!';
      }
    }

    function getValuesFromRange(rangeStr, data) {
      const parts = rangeStr.split(':');
      if (parts.length !== 2) return [];

      const startCol = parts[0].match(/[A-Z]+/)[0];
      const startRow = parseInt(parts[0].match(/[0-9]+/)[0], 10);
      const endCol = parts[1].match(/[A-Z]+/)[0];
      const endRow = parseInt(parts[1].match(/[0-9]+/)[0], 10);

      let values = [];
      for (let r = startRow; r <= endRow; r++) {
        const key = `${startCol}${r}`;
        const val = parseFloat(data[key]);
        if (!isNaN(val)) values.push(val);
      }
      return values;
    }

    function applyConditionalRule() {
      const rule = document.getElementById('condRule').value;
      const targetVal = parseFloat(document.getElementById('condVal').value);
      const color = document.getElementById('condColor').value;

      for (let r = 1; r <= numRows; r++) {
        for (let c = 1; c <= numCols; c++) {
          const cellKey = `${getColName(c)}${r}`;
          const val = parseFloat(sheetsData[currentSheetIndex][cellKey]);
          if (!isNaN(val)) {
            const td = getTdElement(r, c);
            if (!td) continue;
            if ((rule === 'gt' && val > targetVal) || (rule === 'lt' && val < targetVal) || (rule === 'eq' && val === targetVal)) {
              td.style.backgroundColor = color;
            }
          }
        }
      }
      closeModal('conditionalModal');
    }

    function clearSelectedCell() {
      const cellKey = `${getColName(activeCell.col)}${activeCell.row}`;
      delete sheetsData[currentSheetIndex][cellKey];
      const td = getTdElement(activeCell.row, activeCell.col);
      if (td) {
        td.innerText = '';
        td.removeAttribute('style');
      }
      document.getElementById('formulaInput').value = '';
      saveToStorage();
    }

    /* BÚSQUEDA Y REEMPLAZO */
    function executeSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('td.highlight-search').forEach(td => td.classList.remove('highlight-search'));
      if (!query) return;

      for (let r = 1; r <= numRows; r++) {
        for (let c = 1; c <= numCols; c++) {
          const cellKey = `${getColName(c)}${r}`;
          const val = (sheetsData[currentSheetIndex][cellKey] || '').toString().toLowerCase();
          if (val.includes(query)) {
            const td = getTdElement(r, c);
            if (td) td.classList.add('highlight-search');
          }
        }
      }
    }

    function executeReplace() {
      const query = document.getElementById('searchInput').value;
      const replaceVal = document.getElementById('replaceInput').value;
      if (!query) return;

      for (let r = 1; r <= numRows; r++) {
        for (let c = 1; c <= numCols; c++) {
          const cellKey = `${getColName(c)}${r}`;
          let val = (sheetsData[currentSheetIndex][cellKey] || '').toString();
          if (val.includes(query)) {
            sheetsData[currentSheetIndex][cellKey] = val.replaceAll(query, replaceVal);
          }
        }
      }
      renderSheet();
      saveToStorage();
      closeModal('searchModal');
    }

    /* ORDENAMIENTO (A-Z / Z-A) */
    function sortColumn(order) {
      const col = activeCell.col;
      const colName = getColName(col);
      let rowsData = [];

      for (let r = 1; r <= numRows; r++) {
        const key = `${colName}${r}`;
        rowsData.push({ row: r, val: sheetsData[currentSheetIndex][key] || '' });
      }

      rowsData.sort((a, b) => {
        if (order === 'ASC') return a.val.localeCompare(b.val, undefined, { numeric: true });
        return b.val.localeCompare(a.val, undefined, { numeric: true });
      });

      const newSheetData = {};
      rowsData.forEach((item, newIdx) => {
        const oldRow = item.row;
        const targetRow = newIdx + 1;
        for (let c = 1; c <= numCols; c++) {
          const oldKey = `${getColName(c)}${oldRow}`;
          const newKey = `${getColName(c)}${targetRow}`;
          if (sheetsData[currentSheetIndex][oldKey]) {
            newSheetData[newKey] = sheetsData[currentSheetIndex][oldKey];
          }
        }
      });

      sheetsData[currentSheetIndex] = newSheetData;
      renderSheet();
      saveToStorage();
    }

    /* CÓDIGO QR Y ESCÁNER */
    function generateQR() {
      const cellKey = `${getColName(activeCell.col)}${activeCell.row}`;
      const val = sheetsData[currentSheetIndex][cellKey] || '';
      if (!val) return alert("Selecciona una celda con contenido para generar el QR.");

      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, { text: val, width: 150, height: 150 });
      openModal('qrModal');
    }

    function startScanner() {
      openModal('scannerModal');
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 200, height: 200 } },
        (decodedText) => {
          onCellEdit(activeCell.row, activeCell.col, decodedText);
          stopScanner();
        },
        () => {}
      );
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          closeModal('scannerModal');
        }).catch(() => closeModal('scannerModal'));
      } else {
        closeModal('scannerModal');
      }
    }

    /* HISTORIAL (DESHACER / REHACER) */
    function saveStateToHistory() {
      historyStack = historyStack.slice(0, historyStep + 1);
      historyStack.push(JSON.stringify(sheetsData));
      historyStep++;
    }

    function undo() {
      if (historyStep > 0) {
        historyStep--;
        sheetsData = JSON.parse(historyStack[historyStep]);
        renderSheet();
      }
    }

    function redo() {
      if (historyStep < historyStack.length - 1) {
        historyStep++;
        sheetsData = JSON.parse(historyStack[historyStep]);
        renderSheet();
      }
    }

    function handleKeyEvents(e, r, c) {
      if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
      if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
      if (e.key === 'Enter') {
        e.preventDefault();
        selectCell(Math.min(r + 1, numRows), c);
        getTdElement(Math.min(r + 1, numRows), c).focus();
      }
    }

    /* FORMATO Y MODALES */
    function applyFormat(type) {
      const td = getTdElement(activeCell.row, activeCell.col);
      if (!td) return;
      if (type === 'bold') td.style.fontWeight = td.style.fontWeight === 'bold' ? 'normal' : 'bold';
      if (type === 'wrap') td.classList.toggle('wrap-text');
    }

    function applyStyle(prop, val) {
      const td = getTdElement(activeCell.row, activeCell.col);
      if (td) td.style[prop] = val;
    }

    function setCellFormat(fmt) {
      const cellKey = `${getColName(activeCell.col)}${activeCell.row}`;
      if (!cellFormats[currentSheetIndex]) cellFormats[currentSheetIndex] = {};
      cellFormats[currentSheetIndex][cellKey] = fmt;
      evaluateAllFormulas();
      saveToStorage();
    }

    function openModal(id) { document.getElementById(id).style.display = 'block'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function exportPDF() { window.print(); }

    function modifyStructure(action) {
      if (action === 'addRow') numRows++;
      if (action === 'addCol') numCols++;
      initGrid();
    }

    function addNewSheet() {
      sheetsData.push({});
      cellFormats.push({});
      cellStyles.push({});
      const idx = sheetsData.length - 1;
      const tabsBar = document.getElementById('tabsBar');
      const addBtn = tabsBar.querySelector('button[onclick="addNewSheet()"]');

      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.innerText = `HOJA ${idx + 1}`;
      btn.onclick = () => switchSheet(idx);
      tabsBar.insertBefore(btn, addBtn);

      switchSheet(idx);
    }

    function switchSheet(idx) {
      currentSheetIndex = idx;
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });
      renderSheet();
    }

    function renderSheet() {
      evaluateAllFormulas();
      selectCell(activeCell.row, activeCell.col);
    }

    function generateChart() {
      const labels = [];
      const data = [];
      for (let r = 1; r <= 8; r++) {
        const cellKey = `${getColName(activeCell.col)}${r}`;
        const val = parseFloat(sheetsData[currentSheetIndex][cellKey]);
        if (!isNaN(val)) { labels.push(`Fila ${r}`); data.push(val); }
      }
      if (data.length === 0) return alert("Ingresa valores numéricos para graficar.");

      openModal('chartModal');
      const ctx = document.getElementById('myChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: { labels: labels, datasets: [{ label: `Datos Col ${getColName(activeCell.col)}`, data: data, backgroundColor: '#00ff66' }] },
        options: { responsive: true }
      });
    }

    function saveToStorage() {
      localStorage.setItem('meow_sheets_data', JSON.stringify(sheetsData));
      localStorage.setItem('meow_sheets_formats', JSON.stringify(cellFormats));
    }

    function loadFromStorage() {
      const d = localStorage.getItem('meow_sheets_data');
      const f = localStorage.getItem('meow_sheets_formats');
      if (d) sheetsData = JSON.parse(d);
      if (f) cellFormats = JSON.parse(f);
    }

    function clearSheet() {
      if (confirm('¿Vaciar los datos de la hoja?')) {
        sheetsData[currentSheetIndex] = {};
        cellFormats[currentSheetIndex] = {};
        saveToStorage();
        initGrid();
      }
    }

    function exportToExcel() {
      const wb = XLSX.utils.book_new();
      sheetsData.forEach((sheet, idx) => {
        const aoa = [];
        for (let r = 1; r <= numRows; r++) {
          const rowData = [];
          for (let c = 1; c <= numCols; c++) {
            const key = `${getColName(c)}${r}`;
            rowData.push(sheet[key] || '');
          }
          aoa.push(rowData);
        }
        const ws = XLSX.utils.aoa_to_sheet(aoa);
        XLSX.utils.book_append_sheet(wb, ws, `Hoja ${idx + 1}`);
      });
      XLSX.writeFile(wb, 'meow_sheets_ultimate.xlsx');
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
    }

    initGrid();
  </script>
</body>
</html>
